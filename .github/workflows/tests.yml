# Tests — the plugin/test suite, split across parallel runners.
#
# Runs on PRs into main and release/*, and only when they touch code. It is the
# other way round on purpose: a PR skips the suite only when EVERY file it
# touches is documentation (tracker/, docs/, a markdown file at the root), so a
# new code directory is tested without anyone having to list it here.
#
# The check to mark as required is "Tests", not the shards: it passes when the
# suite is skipped (no code changed) and fails if any shard fails. A path filter
# on the trigger itself would leave a required check pending forever on a PR
# that skips it.

name: Tests

on:
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOCS_ONLY_RE: '^(tracker/|docs/|[^/]+\.md$)'
  # Every shard must run with the same -j: it decides how golden rules are split,
  # and with it the list the shards are cut from.
  JOBS: 4
  SHARDS: 4

jobs:
  changes:
    name: Does it touch code?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')"
          code="$(printf '%s\n' "$files" | grep -vE "$DOCS_ONLY_RE" || true)"
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            printf 'Code touched:\n%s\n' "$code" | head -20
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation touched: the suite is skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  suite:
    name: Suite ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade tests build fixtures from every release tag
      - name: Git identity for the tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Run shard ${{ matrix.shard }}/${{ env.SHARDS }}
        run: bash plugin/test/run.sh -j "$JOBS" --shard "${{ matrix.shard }}/$SHARDS" --inventory inventory.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-${{ matrix.shard }}
          path: inventory.txt
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests
    needs: [changes, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SUITE: ${{ needs.suite.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "::error::Could not read the PR's files."; exit 1; fi
          if [ "$CODE" != "true" ]; then echo "No code touched: nothing to test."; exit 0; fi
          if [ "$SUITE" != "success" ]; then echo "::error::The suite failed in at least one shard ($SUITE)."; exit 1; fi
          echo "All shards passed."
