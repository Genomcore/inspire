name: Sync release with main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-release
  cancel-in-progress: false

env:
  RELEASE_BRANCH_RE: '^release/[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: GitHub App token
        id: app
        if: vars.SYNC_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SYNC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SYNC_RELEASE_APP_KEY }}

      - name: Open or advance the sync/<release> → release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VIA_APP: ${{ steps.app.outputs.token != '' }}
        run: |
          set -euo pipefail
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          target="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/heads/release/" -q '.[].ref' \
                    | sed 's#^refs/heads/##' | grep -E "$RELEASE_BRANCH_RE" | sort | tail -1 || true)"
          if [ -z "$target" ]; then
            summary "No open release/YYYY-MM-DD branch: nothing to sync."
            exit 0
          fi

          merged="$(gh pr list --head "$target" --base main --state merged --json number -q length)"
          if [ "$merged" -gt 0 ]; then
            summary "$target is already merged into main: waiting for the next release."
            exit 0
          fi

          behind="$(gh api "repos/$GH_REPO/compare/$target...main" -q .ahead_by)"
          if [ "$behind" -eq 0 ]; then
            summary "$target already has everything in main."
            exit 0
          fi

          branch="sync/$target"
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" -q .object.sha)"

          existing="$(gh pr list --head "$branch" --base "$target" --state open --json url -q '.[0].url // empty')"
          if [ -n "$existing" ]; then
            own="$(gh api "repos/$GH_REPO/compare/main...$branch" -q .ahead_by)"
            if [ "$own" -eq 0 ]; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$main_sha" -F force=false >/dev/null
              summary "$branch advanced to main @ ${main_sha:0:7}; the PR was already open: $existing"
            else
              summary "The PR is already open and $branch has $own commit(s) of its own (resolved conflicts): left untouched. $existing"
            fi
            exit 0
          fi

          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$main_sha" -F force=true >/dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null
          fi

          cat > body.md <<BODY
          Syncs \`$target\` with \`main\` ($behind commit(s) that are in main and not in the release: hotfixes, \`docs/\` tickets…).

          - Merge with a **merge commit**, never squash: with squash the release and main diverge and the next release → main PR conflicts.
          - If there are conflicts (the version, for example, when a hotfix bumps it), resolve them in this PR: with GitHub's editor or by pushing to \`$branch\`. Never in \`main\`.
          - While it is open and has no commits of its own, every push to \`main\` advances \`$branch\` and this PR picks up what is new.
          - Merging it moves the head of \`$target\`: the \`$target\` → main PR will need a new approval before the daily stand-up.
          BODY
          if [ "$VIA_APP" != true ]; then
            echo "- If the checks do not show up, close and reopen the PR: PRs opened by \`GITHUB_TOKEN\` do not trigger other workflows." >> body.md
          fi
          url="$(gh pr create --base "$target" --head "$branch" --title "Sync main into $target" --body-file body.md)"
          summary "PR opened: $url"
