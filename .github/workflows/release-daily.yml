# Daily release.
#
# schedule (Mon–Fri after the daily stand-up) / manual:
#   1. Finds THE open release/YYYY-MM-DD → main PR. None: does nothing.
#      More than one: fails.
#   2. Requires: not a draft, ≥1 approval on the latest commit, no
#      "changes requested", every check green (including "Release check")
#      and a version that goes up and is not tagged yet.
#   3. Merge (merge commit) → lightweight tag v<version> on the merge commit →
#      GitHub Release.
#   4. Creates the next release/<today's date> branch from main if there is no
#      other one.
#   5. (retarget job) Retargets to that branch the open PRs left without a
#      release (see below), reruns their Release check and deletes the branch
#      of the release just published.
#
# push to release/YYYY-MM-DD: opens the release → main PR if it does not exist
# yet and, if it is the newest release, retargets to it the PRs left without a
# release.
#
# Retargeting: when the branch of a merged release is deleted, GitHub moves the
# PRs that pointed at it to main. This workflow moves them to the open release,
# together with any PR against main that does not come from release/, hotfix/
# or docs/ (the Release check would not let it in) and the ones that point at a
# release/ already merged into main.
# push to main (a hotfix or a manual merge of the release): creates the tag and
# the release if main's version is not tagged yet.
#
# Release notes, in order: the "## <version>" section of CHANGELOG.md → the
# "## Release notes" section of the PR body → autogenerated notes.
#
# The only difference between Inspire and Factory is the env block.

name: Daily release

on:
  schedule:
    # Cron in UTC. 09:28 UTC = 10:28 in Madrid in winter time (CET).
    # In summer time (CEST) change it to '28 8 * * 1-5'.
    - cron: '28 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check, without merging or publishing
        type: boolean
        default: false
  push:
    branches: [main, 'release/**']

# Each job asks only for what it uses.
permissions: {}

concurrency:
  # Publishing never runs twice at once; pushes are not limited.
  group: ${{ github.event_name == 'push' && format('push-{0}', github.run_id) || 'release-publish' }}
  cancel-in-progress: false

env:
  VERSION_FILE: plugin/.claude-plugin/plugin.json
  VERSION_JQ: .version
  RELEASE_BRANCH_RE: '^release/[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  # Branches that may target main (same as HEAD_BRANCH_RE in release-check.yml).
  # PRs against main from any other branch are retargeted to the open release.
  ALLOWED_TO_MAIN_RE: '^(release/[0-9]{4}-[0-9]{2}-[0-9]{2}|hotfix/.+|docs/.+)$'
  REQUIRED_CHECK: Release check
  # true: the approval must be on the PR's latest commit, so nothing that
  # landed after the approval gets published.
  REQUIRE_APPROVAL_ON_HEAD: 'true'
  TZ_RELEASE: Europe/Madrid
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # tags, branches and releases
      pull-requests: write # open and merge the release PR
      checks: read         # gh pr checks: read the PR's check runs
      statuses: read       # gh pr checks: read the PR's commit statuses
      actions: read        # gh pr checks: read each check's workflow
    outputs:
      # Branch of the release just merged (empty if nothing was merged).
      merged_branch: ${{ steps.merge.outputs.sha != '' && steps.pr.outputs.branch || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── push to release/YYYY-MM-DD ─────────────────────────────────────────
      - name: Open the release PR if it does not exist
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ $RELEASE_BRANCH_RE ]]; then
            echo "$BRANCH does not follow release/YYYY-MM-DD: no PR is opened."
            exit 0
          fi
          open="$(gh pr list --head "$BRANCH" --base main --state open --json number -q length)"
          ahead="$(gh api "repos/$GH_REPO/compare/main...$BRANCH" -q .ahead_by)"
          if [ "$open" -gt 0 ] || [ "$ahead" -eq 0 ]; then
            echo "Nothing to do (open PRs: $open, commits ahead of main: $ahead)."
            exit 0
          fi
          cat > body.md <<'EOF'
          Daily release. It is published automatically after the daily stand-up if it is approved and every check is green.

          Before approving:
          - [ ] Version bumped (patch or minor) in the version file
          - [ ] Inspire: `marketplace.json`, `plugin/manifests/<version>.json` and the `CHANGELOG.md` section (`/template-release` skill)

          ## Release notes

          <!-- If the repo has no CHANGELOG.md, whatever you write here is published as the GitHub Release notes. -->
          EOF
          gh pr create --base main --head "$BRANCH" --title "Release ${BRANCH#release/}" --body-file body.md

      # ── schedule / manual: find and validate the PR ────────────────────────
      - name: Find and validate the release PR
        id: pr
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          prs="$(gh pr list --base main --state open --limit 100 \
                   --json number,headRefName,headRefOid,isDraft,url \
                 | jq --arg re "$RELEASE_BRANCH_RE" '[.[] | select(.headRefName | test($re))]')"
          count="$(jq length <<<"$prs")"

          if [ "$count" -eq 0 ]; then
            summary "No open release/YYYY-MM-DD PR against main: nothing is published today."
            exit 0
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::There are $count open release PRs against main; there must be only one:"
            jq -r '.[] | "  #\(.number) \(.headRefName) \(.url)"' <<<"$prs"
            exit 1
          fi

          num="$(jq -r '.[0].number' <<<"$prs")"
          branch="$(jq -r '.[0].headRefName' <<<"$prs")"
          sha="$(jq -r '.[0].headRefOid' <<<"$prs")"
          url="$(jq -r '.[0].url' <<<"$prs")"
          summary "PR: [#$num $branch]($url) @ ${sha:0:7}"

          if [ "$(jq -r '.[0].isDraft' <<<"$prs")" = "true" ]; then
            echo "::warning::#$num is a draft: not published."
            exit 0
          fi

          # Approvals: each person's latest review (ignoring comments).
          reviews="$(gh api --paginate "repos/$GH_REPO/pulls/$num/reviews" \
                     | jq -s 'add | map(select(.state != "COMMENTED"))
                              | group_by(.user.login) | map(max_by(.submitted_at))')"
          changes="$(jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length' <<<"$reviews")"
          if [ "$REQUIRE_APPROVAL_ON_HEAD" = "true" ]; then
            approvals="$(jq --arg sha "$sha" '[.[] | select(.state == "APPROVED" and .commit_id == $sha)] | length' <<<"$reviews")"
          else
            approvals="$(jq '[.[] | select(.state == "APPROVED")] | length' <<<"$reviews")"
          fi
          if [ "$changes" -gt 0 ]; then
            echo "::warning::#$num has changes requested: not published."
            exit 0
          fi
          if [ "$approvals" -lt 1 ]; then
            echo "::warning::#$num has no approval on the latest commit (${sha:0:7}): not published."
            exit 0
          fi

          # Checks of the latest commit.
          # gh pr checks exits non-zero when checks are running or red, so its
          # exit code is not used: it must return a list. If it cannot read
          # them (for example, token permissions), the error says why.
          checks="$(gh pr checks "$num" --json name,bucket 2>checks.err || true)"
          if ! jq -e 'type == "array"' <<<"$checks" >/dev/null 2>&1; then
            echo "::error::Cannot read the checks of #$num: $(tr '\n' ' ' < checks.err)"
            exit 1
          fi
          pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks")"
          failed="$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' <<<"$checks")"
          has_required="$(jq --arg n "$REQUIRED_CHECK" '[.[] | select(.name == $n and .bucket == "pass")] | length' <<<"$checks")"
          if [ -n "$failed" ]; then
            echo "::error::#$num has failing checks: $failed"
            exit 1
          fi
          if [ "$pending" -gt 0 ]; then
            echo "::warning::#$num has checks still running: not published today."
            exit 0
          fi
          if [ "$has_required" -lt 1 ]; then
            echo "::error::#$num does not have the '$REQUIRED_CHECK' check green on ${sha:0:7}. Push to the branch so it runs."
            exit 1
          fi

          # Version: the Release check's test, repeated to be safe.
          git fetch -q origin "$branch"
          base_v="$(git show "origin/main:$VERSION_FILE" | jq -r "$VERSION_JQ")"
          head_v="$(git show "$sha:$VERSION_FILE" | jq -r "$VERSION_JQ")"
          highest="$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)"
          if [ "$head_v" = "$base_v" ] || [ "$highest" != "$head_v" ]; then
            echo "::error::The version does not go up: main $base_v, release $head_v."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$head_v" >/dev/null; then
            echo "::error::v$head_v is already tagged."
            exit 1
          fi

          summary "Ready to publish: $base_v → **$head_v**"
          {
            echo "ready=true"
            echo "number=$num"
            echo "branch=$branch"
            echo "sha=$sha"
            echo "version=$head_v"
          } >> "$GITHUB_OUTPUT"

      - name: Merge the PR
        id: merge
        if: steps.pr.outputs.ready == 'true' && !inputs.dry_run
        env:
          NUM: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          # --match-head-commit: if someone pushes right now, nothing is merged.
          gh pr merge "$NUM" --merge --match-head-commit "$SHA"
          merge_sha="$(gh pr view "$NUM" --json mergeCommit -q .mergeCommit.oid)"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Merged #$NUM → main @ ${merge_sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
          # The branch is not deleted here: it is deleted at the end, once its
          # PRs point at the new release (deleting it by hand would close them).

      # ── tag + GitHub Release (after the merge above or after a push to main) ─
      - name: Tag and GitHub Release
        if: steps.merge.outputs.sha != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha || github.sha }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          git fetch -q origin main --tags
          v="$(git show "$MERGE_SHA:$VERSION_FILE" | jq -r "$VERSION_JQ")"
          tag="v$v"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists: nothing to publish."
            exit 0
          fi

          # Notes: CHANGELOG.md → the PR's "## Release notes" → autogenerated.
          : > notes.md
          # The awk scripts read their whole input instead of leaving with `exit`
          # at the end of the section: with pipefail, closing the pipe kills the
          # producer with SIGPIPE (141) as soon as the input outgrows the pipe
          # buffer (64 KB).
          if git cat-file -e "$MERGE_SHA:CHANGELOG.md" 2>/dev/null; then
            git show "$MERGE_SHA:CHANGELOG.md" | awk -v v="$v" '
              $0 ~ "^## " { if (on) { on = 0; done = 1 } else if (!done && (index($0, "## " v " ") == 1 || $0 == "## " v)) { on = 1; next } }
              on' > notes.md
          fi
          if [ ! -s notes.md ]; then
            [ -n "$PR_NUM" ] || PR_NUM="$(gh api "repos/$GH_REPO/commits/$MERGE_SHA/pulls" -q '.[0].number // empty')"
            if [ -n "$PR_NUM" ]; then
              gh pr view "$PR_NUM" --json body -q .body \
                | awk '!done && /^## Release notes/ { on = 1; next } on && /^## / { on = 0; done = 1 } on' \
                | sed -e 's/<!--.*-->//g' > notes.md
            fi
          fi

          # Lightweight tag on the merge commit (the /template-release convention).
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$MERGE_SHA" >/dev/null
          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          fi
          echo "Published $tag @ ${MERGE_SHA:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"

      # ── next release branch ────────────────────────────────────────────────
      - name: Create the next release/YYYY-MM-DD branch
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.dry_run
        env:
          MERGED_BRANCH: ${{ steps.merge.outputs.sha != '' && steps.pr.outputs.branch || '' }}
        run: |
          set -euo pipefail
          # The release just merged does not count: the retarget job deletes it.
          open_branches="$(git ls-remote --heads origin 'release/*' \
                           | sed 's#.*refs/heads/##' | grep -E "$RELEASE_BRANCH_RE" \
                           | grep -vxF "${MERGED_BRANCH:-}" || true)"
          if [ -n "$open_branches" ]; then
            echo "A release branch is already open: $open_branches" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          next="release/$(TZ="$TZ_RELEASE" date +%F)"
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" -q .object.sha)"
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$next" -f sha="$main_sha" >/dev/null
          echo "Created $next from main @ ${main_sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"

  # A separate job so that only it has actions: write (to rerun the Release check).
  # It runs even if the release job fails: moving PRs does not depend on publishing.
  retarget:
    needs: release
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-latest
    permissions:
      contents: write      # delete the branch of the published release
      pull-requests: write # change the PRs' base branch and comment
      actions: write       # rerun the Release check that failed while they targeted main
    steps:
      - name: Retarget PRs to the open release
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PUSHED: ${{ github.event_name == 'push' && github.ref_name || '' }}
          MERGED_BRANCH: ${{ needs.release.outputs.merged_branch }}
          RELEASE_CHECK_WORKFLOW: Release check
        run: |
          set -euo pipefail
          # The open release is the newest release/YYYY-MM-DD.
          target="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/heads/release/" -q '.[].ref' \
                    | sed 's#^refs/heads/##' | grep -E "$RELEASE_BRANCH_RE" \
                    | grep -vxF "${MERGED_BRANCH:-}" | sort | tail -1 || true)"
          if [ -z "$target" ]; then
            echo "No open release branch: nothing is retargeted."
            exit 0
          fi
          if [ -n "$PUSHED" ] && [ "$PUSHED" != "$target" ]; then
            echo "$PUSHED is not the newest release ($target): nothing is retargeted."
            exit 0
          fi

          stale_syncs="$(gh pr list --state open --limit 300 --json number,baseRefName,headRefName \
            | jq -r --arg t "$target" '
                .[] | select((.headRefName == "main" or (.headRefName | startswith("sync/"))) and .baseRefName != $t)
                    | "\(.number) \(.headRefName)"')"
          while read -r num head; do
            [ -n "$num" ] || continue
            if [ "$DRY_RUN" = true ]; then
              echo "(dry run) would close #$num $head"
              continue
            fi
            flags=()
            [ "$head" = main ] || flags=(--delete-branch)
            gh pr close "$num" "${flags[@]}" --comment "Closed: its release is no longer the open one (\`$target\`). The Sync release with main workflow will open a new one if needed." \
              && echo "- #$num \`$head\`: closed" | tee -a "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::#$num: could not be closed."
          done <<<"$stale_syncs"

          candidates="$(gh pr list --state open --limit 300 --json number,baseRefName,headRefName,headRefOid \
            | jq -r --arg t "$target" --arg allowed "$ALLOWED_TO_MAIN_RE" --arg rel "$RELEASE_BRANCH_RE" '
                .[] | select(.headRefName != $t and .baseRefName != $t)
                    | select(.headRefName != "main" and (.headRefName | startswith("sync/") | not))
                    | select((.baseRefName == "main" and (.headRefName | test($allowed) | not))
                             or (.baseRefName | test($rel)))
                    | "\(.number) \(.baseRefName) \(.headRefName) \(.headRefOid)"')"

          moved=0
          while read -r num base head sha; do
            [ -n "$num" ] || continue
            # A PR against another release/ is only moved if that release is already in main.
            if [ "$base" != main ] && [ "$base" != "${MERGED_BRANCH:-}" ]; then
              ahead="$(gh api "repos/$GH_REPO/compare/main...$base" -q .ahead_by 2>/dev/null || echo 1)"
              [ "$ahead" -eq 0 ] || continue
            fi
            if [ "$DRY_RUN" = true ]; then
              echo "(dry run) #$num $head: $base → $target"
              continue
            fi
            gh api -X PATCH "repos/$GH_REPO/pulls/$num" -f base="$target" >/dev/null
            gh pr comment "$num" --body "Retargeted from \`$base\` to \`$target\`, the open release. Only \`release/\`, \`hotfix/\` and \`docs/\` branches can merge into main."
            echo "- #$num \`$head\`: $base → $target" | tee -a "$GITHUB_STEP_SUMMARY"
            moved=$((moved + 1))

            # While it targeted main, the Release check failed on this commit.
            # Rerun, it sees the PR now targets the release and applies the
            # release rules.
            failed_run="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$sha&event=pull_request&per_page=100" \
              | jq -r --arg w "$RELEASE_CHECK_WORKFLOW" '
                  [.workflow_runs[] | select(.name == $w)] | max_by(.created_at) // empty
                  | select(.conclusion == "failure") | .id')"
            if [ -n "$failed_run" ]; then
              gh api -X POST "repos/$GH_REPO/actions/runs/$failed_run/rerun-failed-jobs" >/dev/null \
                && echo "  Release check rerun (run $failed_run)" \
                || echo "::warning::#$num: could not rerun the Release check (run $failed_run)."
            fi
          done <<<"$candidates"
          echo "PRs retargeted to $target: $moved"

          # With no PRs left hanging, the published branch can be deleted (if
          # automatic branch deletion is on, it is already gone).
          if [ -n "${MERGED_BRANCH:-}" ] && [ "$DRY_RUN" != true ]; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$MERGED_BRANCH" >/dev/null 2>&1 || true
          fi
