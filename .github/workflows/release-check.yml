# Release check — runs on every PR against main or against the open release.
#
# Against main it blocks the merge if:
#   - the head branch is not release/YYYY-MM-DD, hotfix/<name> or docs/<name>
#   - the version does not go up from main (strictly greater semver);
#     docs/ branches need no bump, but may only touch tracker/
#   - the version is already tagged (v<version> already published)
#   - (if the repo has CHANGELOG.md) the "## <version>" section is missing
#   - (Inspire only) the repo's own check: plugin.json == marketplace.json
#     and plugin/manifests/<version>.json matches the tree
#
# Against release/YYYY-MM-DD every PR already brings what the release needs to
# reach main, instead of fixing it by hand when the release closes:
#   - the version goes up from main and is not published. Every PR of the same
#     release bumps to the same version, so the first one to land brings the
#     bump and in the rest it is an identical change git does not conflict on.
#     A day without PRs cuts no version.
#   - (if the repo has CHANGELOG.md) the "## <version>" section exists
#   - (Inspire only) if the PR changes the runtime, the manifest is up to date
#     and the PR adds its entry to that CHANGELOG section. The /release-entry
#     skill prepares it.
# What is checked is the PR merged with the release as it is now
# (refs/pull/N/merge), which is what will land: if another PR already brought
# the bump, it counts for all of them without updating them from the release.
# sync/ PRs (main → release, from sync-release.yml) are not checked: they only
# bring what is already in main.
#
# The PR's base is read when the check runs, not when it was triggered: if the
# daily workflow retargeted it from main to the open release and reran this
# check, the release rules apply.
#
# To actually block, add "Release check" as a required status check in the
# main ruleset.
#
# The only difference between Inspire and Factory is the env block.

name: Release check

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read # read which branch the PR targets now

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Inspire: the release identity is plugin.json (marketplace.json duplicates it).
  VERSION_FILE: plugin/.claude-plugin/plugin.json
  VERSION_JQ: .version
  RELEASE_BRANCH_RE: '^release/[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  SYNC_BRANCH_RE: '^sync/'
  HEAD_BRANCH_RE: '^(release/[0-9]{4}-[0-9]{2}-[0-9]{2}|hotfix/.+|docs/.+)$'
  # Branches that reach main without a bump (they publish no release): they
  # only create or update tickets, so they may only touch DOCS_PATHS_RE.
  NO_BUMP_RE: '^docs/.+$'
  DOCS_PATHS_RE: '^tracker/'

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    steps:
      # Read where the PR points now, not when the run was triggered: on a
      # rerun the event still names the previous branch.
      - name: Where the PR points
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base="$(gh api "repos/$GH_REPO/pulls/$NUM" -q .base.ref)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = main ]; then
            echo "mode=main" >> "$GITHUB_OUTPUT"
          elif [[ "$base" =~ $RELEASE_BRANCH_RE ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "✓ The PR targets $base, which is neither main nor a daily release: nothing to check." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The next steps depend on steps.branch: if it does not run, neither do they.
      # bump=true: check the version (and CHANGELOG); false: docs/ into main;
      # none: sync/ PR into the release, nothing to check.
      - name: Allowed head branch
        id: branch
        if: steps.live.outputs.mode == 'main' || steps.live.outputs.mode == 'release'
        env:
          HEAD_REF: ${{ github.head_ref }}
          MODE: ${{ steps.live.outputs.mode }}
          BASE: ${{ steps.live.outputs.base }}
        run: |
          if [ "$MODE" = release ]; then
            if [[ "$HEAD_REF" =~ $SYNC_BRANCH_RE ]]; then
              echo "bump=none" >> "$GITHUB_OUTPUT"
              echo "✓ $HEAD_REF → $BASE (sync from main: nothing to check)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "bump=true" >> "$GITHUB_OUTPUT"
              echo "✓ $HEAD_REF → $BASE"
            fi
            exit 0
          fi
          if ! [[ "$HEAD_REF" =~ $HEAD_BRANCH_RE ]]; then
            echo "::error::Only release/YYYY-MM-DD, hotfix/<name> and docs/<name> branches can merge into main. This PR comes from '$HEAD_REF': merge it into the open release/ branch."
            exit 1
          fi
          if [[ "$HEAD_REF" =~ $NO_BUMP_RE ]]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "✓ $HEAD_REF (docs: no version bump, tracker/ only)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "✓ $HEAD_REF"
          fi

      # Against main, the PR's commit; against the release, its merge with the
      # current release (the live ref, not github.sha: on a rerun after a
      # retarget, github.sha is still the merge with main).
      - uses: actions/checkout@v4
        if: steps.branch.outputs.bump == 'true' || steps.branch.outputs.bump == 'false'
        with:
          ref: ${{ steps.live.outputs.mode == 'release' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.event.pull_request.head.sha }}
          fetch-depth: 0 # full history + tags

      - name: docs/ only touches tracker/
        if: steps.branch.outputs.bump == 'false'
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          outside="$(git diff --name-only "$base" HEAD | grep -vE "$DOCS_PATHS_RE" || true)"
          if [ -n "$outside" ]; then
            echo "::error::A docs/ branch may only touch tickets (tracker/). These files must go through the open release/ branch or a hotfix/:"
            printf '  %s\n' $outside
            exit 1
          fi
          echo "✓ only tracker/ changes"

      - name: The version goes up and is not published
        id: version
        if: steps.branch.outputs.bump == 'true'
        run: |
          set -euo pipefail
          base_v="$(git show "origin/main:$VERSION_FILE" | jq -r "$VERSION_JQ")"
          head_v="$(jq -r "$VERSION_JQ" "$VERSION_FILE")"
          echo "main: $base_v → PR: $head_v"

          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$head_v" =~ $semver ]]; then
            echo "::error file=$VERSION_FILE::The version '$head_v' is not X.Y.Z."
            exit 1
          fi
          highest="$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)"
          if [ "$head_v" = "$base_v" ] || [ "$highest" != "$head_v" ]; then
            echo "::error file=$VERSION_FILE::The version must go up from main ($base_v). It is $head_v. In a PR into the release, bump to the same version as the rest of the release (main's next minor if nobody has bumped it yet)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$head_v" >/dev/null; then
            echo "::error file=$VERSION_FILE::v$head_v is already tagged: pick a new version."
            exit 1
          fi
          echo "version=$head_v" >> "$GITHUB_OUTPUT"
          echo "✓ $base_v → $head_v" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CHANGELOG has the version's section
        if: steps.branch.outputs.bump == 'true' && hashFiles('CHANGELOG.md') != ''
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if grep -qE "^## ${V//./\\.}( |$)" CHANGELOG.md; then
            echo "✓ CHANGELOG.md has ## $V"
          else
            echo "::error file=CHANGELOG.md::The '## $V — YYYY-MM-DD' section is missing from CHANGELOG.md."
            exit 1
          fi

      # Exists only in Inspire: checks that marketplace.json matches plugin.json
      # and that plugin/manifests/<version>.json describes the tree. In a PR
      # into the release, also that it brings its CHANGELOG entry.
      - name: Repo's own check (Inspire)
        if: steps.branch.outputs.bump == 'true' && hashFiles('.claude/hooks/template-runtime-version.sh') != ''
        env:
          MODE: ${{ steps.live.outputs.mode }}
          BASE: ${{ steps.live.outputs.base }}
        run: |
          if [ "$MODE" = release ]; then
            bash .claude/hooks/template-runtime-version.sh --check-release "origin/$BASE" HEAD
          else
            base="$(git merge-base origin/main HEAD)"
            bash .claude/hooks/template-runtime-version.sh --check "$base" HEAD
          fi
