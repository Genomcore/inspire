<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>visualizador-orquestrador</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.4 -apple-system, "Segoe UI", sans-serif;
    background: #0f1115; color: #d7dae0; display: flex; height: 100vh;
  }
  aside {
    width: 280px; flex: none; border-right: 1px solid #23262e; overflow-y: auto;
    padding: 12px;
  }
  aside h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
             color: #8b90a0; margin: 0 0 10px; }
  .run-row {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px;
  }
  .run-row:hover { background: #1a1d24; }
  .run-row.active { background: #1e2430; outline: 1px solid #3a4a6b; }
  .run-row .id { font-family: ui-monospace, monospace; font-size: 12px; }
  .run-row .meta { font-size: 11px; color: #8b90a0; margin-top: 2px; }
  main { flex: 1; overflow-y: auto; padding: 20px 28px; }
  .empty { color: #8b90a0; padding: 40px; text-align: center; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
  }
  .badge.running { background: #1e3a5f; color: #6fb3ff; }
  .badge.ended { background: #22331f; color: #8fd16b; }
  .badge.pending { background: #2a2a2a; color: #9a9a9a; }
  .badge.in-phase { background: #2b2350; color: #b79dff; }
  .badge.promoted { background: #1e3a2a; color: #6fdb95; }
  .badge.stalled { background: #4a1f1f; color: #ff8a8a; }
  .badge.blocked { background: #3a2f1a; color: #e0b566; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .subtle { color: #8b90a0; font-size: 12px; }
  .stat-row { display: flex; gap: 24px; margin: 16px 0 24px; flex-wrap: wrap; }
  .stat { background: #171a21; border: 1px solid #23262e; border-radius: 8px;
          padding: 10px 14px; min-width: 110px; }
  .stat .label { font-size: 11px; color: #8b90a0; text-transform: uppercase; }
  .stat .value { font-size: 18px; font-family: ui-monospace, monospace; }
  .wave { margin-bottom: 22px; }
  .wave h3 { font-size: 13px; color: #8b90a0; text-transform: uppercase;
             letter-spacing: .05em; margin-bottom: 8px; }
  .unit {
    border: 1px solid #23262e; border-radius: 8px; padding: 10px 14px;
    margin-bottom: 8px; background: #12151b; cursor: pointer;
  }
  .unit-head { display: flex; justify-content: space-between; align-items: center; }
  .unit-id { font-family: ui-monospace, monospace; font-size: 13px; }
  .unit-kind { color: #8b90a0; font-size: 11px; margin-left: 6px; }
  .unit-detail { margin-top: 10px; border-top: 1px solid #23262e; padding-top: 10px; }
  .timeline-row { display: flex; gap: 8px; font-size: 12px; padding: 2px 0; }
  .timeline-row .phase { width: 90px; color: #8b90a0; }
  .finding { background: #1a1214; border-left: 3px solid #ff8a8a; padding: 6px 10px;
             margin: 4px 0; font-size: 12px; border-radius: 0 4px 4px 0; }
  .finding .title { font-weight: 600; }
  .rework-row { font-size: 11px; color: #8b90a0; margin-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";
import htm from "https://esm.sh/htm@3";

const html = htm.bind(React.createElement);
const { useState, useEffect, useCallback } = React;

function statusClass(status) {
  return (status || "pending").toLowerCase().replace("_", "-");
}

function elapsed(startedAt, endedAt) {
  if (!startedAt) return "—";
  const start = new Date(startedAt).getTime();
  const end = endedAt && endedAt !== "interrupted" ? new Date(endedAt).getTime() : Date.now();
  const seconds = Math.max(0, Math.round((end - start) / 1000));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m ? `${m}m ${s}s` : `${s}s`;
}

function RunList({ runs, activeId, onSelect }) {
  return html`
    <aside>
      <h1>Ejecuciones</h1>
      ${runs.length === 0 && html`<div class="subtle">Ninguna en .inspire/emanate-runs/</div>`}
      ${runs.map(run => html`
        <div key=${run.run_id}
             class=${"run-row" + (run.run_id === activeId ? " active" : "")}
             onClick=${() => onSelect(run.run_id)}>
          <div class="id">${run.run_id}</div>
          <div class="meta">
            <span class=${"badge " + statusClass(run.status)}>${run.status || "?"}</span>
            ${run.goal_branch || ""}
          </div>
        </div>
      `)}
    </aside>
  `;
}

function Unit({ id, unit }) {
  const [open, setOpen] = useState(false);
  const findings = unit.findings || [];
  return html`
    <div class="unit" onClick=${() => setOpen(!open)}>
      <div class="unit-head">
        <div>
          <span class="unit-id">${id}</span>
          <span class="unit-kind">${unit.kind}</span>
        </div>
        <span class=${"badge " + statusClass(unit.status)}>
          ${unit.status}${unit.phase ? ` · ${unit.phase}` : ""}
        </span>
      </div>
      ${open && html`
        <div class="unit-detail">
          ${(unit.timeline || []).map((row, i) => html`
            <div class="timeline-row" key=${i}>
              <span class="phase">${row.phase}</span>
              <span class="subtle">${elapsed(row.started_at, row.ended_at)}</span>
              ${row.ended_at === null && html`<span class="badge in-phase">en curso</span>`}
            </div>
          `)}
          <div class="rework-row">
            rework: ${Object.entries(unit.rework || {}).map(([role, n]) => `${role}=${n}`).join(" · ")}
          </div>
          ${unit.dropped && unit.dropped.length > 0 && html`
            <div class="finding">
              <div class="title">dropped fuera de las carpetas propias</div>
              <div>${unit.dropped.join(", ")}</div>
            </div>
          `}
          ${unit.stall_class && html`
            <div class="finding">
              <div class="title">stalled — ${unit.stall_class}</div>
              <div>${unit.reason || ""}</div>
            </div>
          `}
          ${findings.map((f, i) => html`
            <div class="finding" key=${i}>
              <div class="title">${f.title || f.role || "finding"}</div>
              <div>${f.issue || ""}</div>
            </div>
          `)}
        </div>
      `}
    </div>
  `;
}

function RunDetail({ state }) {
  if (!state) return html`<div class="empty">Selecciona una ejecución</div>`;
  const units = state.units || {};
  const waves = state.waves || [];
  return html`
    <div>
      <h2>${state.run_id}
        <span class=${"badge " + statusClass(state.status)}>${state.status}</span>
      </h2>
      <div class="subtle">${state.goal_branch} · ${state.exit || "en curso"}</div>
      <div class="stat-row">
        <div class="stat"><div class="label">Duración</div>
          <div class="value">${elapsed(state.started_at, state.ended_at)}</div></div>
        <div class="stat"><div class="label">Gasto</div>
          <div class="value">$${(state.spend_usd || 0).toFixed(2)}</div></div>
        <div class="stat"><div class="label">Spawns</div>
          <div class="value">${state.spawn_count || 0}</div></div>
        <div class="stat"><div class="label">Ola</div>
          <div class="value">${state.wave_index || 0}/${waves.length}</div></div>
      </div>
      ${waves.map((wave, i) => html`
        <div class="wave" key=${i}>
          <h3>Ola ${i + 1}</h3>
          ${wave.map(unitId => html`
            <${Unit} key=${unitId} id=${unitId} unit=${units[unitId] || {}} />
          `)}
        </div>
      `)}
    </div>
  `;
}

function App() {
  const initialSession = new URLSearchParams(window.location.search).get("session");
  const [runs, setRuns] = useState([]);
  const [activeId, setActiveId] = useState(initialSession);
  const [state, setState] = useState(null);

  const refreshRuns = useCallback(() => {
    fetch("/api/runs").then(r => r.json()).then(setRuns).catch(() => {});
  }, []);

  useEffect(() => { refreshRuns(); }, [refreshRuns]);

  useEffect(() => {
    if (!activeId) { setState(null); return; }
    const url = new URL(window.location);
    url.searchParams.set("session", activeId);
    window.history.replaceState({}, "", url);

    let cancelled = false;
    const fetchState = () => fetch(`/api/runs/${activeId}/state`)
      .then(r => r.json()).then(data => { if (!cancelled) setState(data); })
      .catch(() => {});
    fetchState();
    const timer = setInterval(() => {
      fetchState();
      refreshRuns();
    }, 2000);
    return () => { cancelled = true; clearInterval(timer); };
  }, [activeId, refreshRuns]);

  return html`
    <${RunList} runs=${runs} activeId=${activeId} onSelect=${setActiveId} />
    <main><${RunDetail} state=${state} /></main>
  `;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
